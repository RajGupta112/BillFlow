services:
  db:
    image: postgres:16
    container_name: invoice_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: billflow_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      N8N_SECURE_COOKIE: "false"      # sirf local http ke liye; deploy karte waqt hata dena
    extra_hosts:
      - "host.docker.internal:host-gateway"   # container se Windows host ka backend dikhe
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  pgdata:
  n8n_data: